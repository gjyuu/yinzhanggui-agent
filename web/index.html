<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>银掌柜 · 银行 AI 智能体</title>
<link rel="stylesheet" href="/static/console.css?v=10">
</head>
<body class="view-customer">

<!-- 背景光束 (与落地页同一套视觉语言) -->
<div class="beams" aria-hidden="true">
  <div class="beam beam--tl"></div>
  <div class="beam beam--tr"></div>
</div>
<div class="app">

  <!-- ============ 左侧: 客户与账户 ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">银</div>
      <div class="brand-text">
        <h1>银掌柜</h1>
        <p>一句话, 把银行办了</p>
      </div>
    </div>

    <div class="user-card">
      <div class="avatar">张</div>
      <div>
        <div class="user-name"><span id="userName">张伟</span> <span class="tag" id="userLevel">金卡客户</span></div>
        <div class="user-sub" id="sessionLabel">会话已加密 · 本地演示环境</div>
      </div>
    </div>

    <div class="panel-title">账户快照</div>
    <div class="accounts" id="accounts"></div>

    <div class="sidebar-foot">
      <button class="ghost-btn" id="btnSelfcheck">🔒 安全自检报告</button>

      <!-- 演示辅助工具: 默认折叠, 避免出现在客户界面 -->
      <button class="dev-toggle" id="devToggle" title="演示辅助">演示工具 ▾</button>
      <div class="dev-tools hidden" id="devTools">
        <button class="dev-item" id="btnDemo">一键演示（15 步）</button>
        <div class="demo-bar"><i id="demoBar"></i></div>
        <div class="demo-progress" id="demoProgress"></div>
        <button class="dev-item" id="btnReset">重置演示数据</button>
      </div>

      <div class="mode" id="modeLabel">理解模式: 规则引擎</div>
    </div>
  </aside>

  <!-- ============ 中间: 对话 ============ -->
  <main class="chat">
    <header class="chat-head">
      <div>
        <h2>和银掌柜说话</h2>
        <p>查询类直接办 · 动钱先确认 · 高风险要验证</p>
      </div>
      <div class="head-right">
        <div class="view-switch" role="tablist" aria-label="视角切换">
          <button class="view-btn on" data-view="customer">客户视角</button>
          <button class="view-btn" data-view="risk">风控视角</button>
        </div>
        <div class="status-dots" id="statusDots" title="当前会话风控状态">
          <i class="g" data-s="done"></i><i class="y" data-s="awaiting_confirm"></i><i class="r" data-s="awaiting_mfa"></i>
          <span id="statusText">就绪</span>
        </div>
      </div>
    </header>

    <div class="messages" id="messages"></div>

    <!-- 快捷场景: 对话输入触发器, 放在输入框上方 -->
    <div class="quick-row" id="quickRow"></div>

    <div class="composer">
      <input id="input" type="text" autocomplete="off"
             placeholder="试试: 我准备给我爱人买车，我能拿出多少钱 / 这个月钱都花哪了 / 我爱人生日快到了">
      <button id="send" class="primary">发送</button>
    </div>
  </main>

  <!-- ============ 右侧: 可解释性 ============ -->
  <aside class="inspector">
    <nav class="tabs">
      <button class="tab active" data-tab="plan">任务 DAG</button>
      <button class="tab" data-tab="policy">权限矩阵</button>
      <button class="tab" data-tab="audit">审计日志</button>
    </nav>

    <section class="tab-body active" id="tab-plan">
      <div class="empty" id="planEmpty">
        <p>还没有任务。</p>
        <p class="dim">发一句话, 这里会实时显示 Agent 拆出来的子任务与依赖关系。</p>
      </div>
      <div id="planWrap" class="hidden">
        <div class="plan-summary" id="planSummary"></div>
        <svg id="dag" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="plan-legend">实线 = 数据依赖; 颜色 = 权限等级; 虚线框 = 等待确认</div>
      </div>
    </section>

    <section class="tab-body" id="tab-policy">
      <p class="dim small">阈值与分级写在代码里, 模型无权修改。下表由后端 /api/policy 实时返回。</p>
      <div id="policyTable"></div>
    </section>

    <section class="tab-body" id="tab-audit">
      <div class="audit-head">
        <span id="auditChain">哈希链校验中…</span>
        <button class="mini-btn" id="btnAuditRefresh">刷新</button>
      </div>
      <div id="auditList" class="audit-list"></div>
    </section>
  </aside>
</div>

<!-- ============ 强验证弹窗 ============ -->
<div class="modal-mask hidden" id="mfaMask">
  <div class="modal">
    <h3>需要强验证</h3>
    <p class="dim" id="mfaActions"></p>
    <div class="mfa-methods" id="mfaMethods"></div>
    <div id="smsRow" class="hidden">
      <input id="smsCode" maxlength="6" placeholder="请输入 6 位短信验证码">
      <div class="demo-hint" id="mfaDemo"></div>
    </div>
    <div class="modal-foot">
      <button class="ghost-btn" id="mfaCancel">放弃操作</button>
      <button class="primary" id="mfaSubmit">提交验证</button>
    </div>
  </div>
</div>

<!-- ============ 安全自检弹窗 ============ -->
<div class="modal-mask hidden" id="scMask">
  <div class="modal wide">
    <h3>安全自检报告</h3>
    <p class="dim" id="scSummary"></p>
    <div id="scList" class="sc-list"></div>
    <div class="modal-foot"><button class="primary" id="scClose">关闭</button></div>
  </div>
</div>

<script src="/static/motion.js?v=10"></script>
<script src="/static/app.js?v=10"></script>
</body>
</html>
