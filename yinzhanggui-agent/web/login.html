<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 银掌柜</title>
<link rel="stylesheet" href="/static/landing.css">
<link rel="stylesheet" href="/static/login.css">
</head>
<body class="login-page">

<div class="beams" aria-hidden="true">
  <div class="beam beam--tl on"></div>
  <div class="beam beam--tr on"></div>
</div>
<div class="grid-veil" aria-hidden="true"></div>

<main class="login-wrap">
  <a class="login-back" href="/">← 返回首页</a>

  <section class="login-card">
    <div class="login-brand">
      <div class="logo">银</div>
      <div>
        <b>银掌柜</b>
        <i>Banking Agent · 演示登录</i>
      </div>
    </div>

    <h1>选择演示身份</h1>
    <p class="login-sub">
      演示环境无需账号密码，也不收集任何凭据。不同身份对应不同的数据权限与界面范围。
    </p>

    <div class="identity">
      <button class="id-item" data-role="customer" data-user="张伟" data-level="金卡客户">
        <span class="ico">🧑</span>
        <span>
          <b>张伟 · 金卡客户</b>
          <i>可用余额 12,846.50 元 · 可对话办理全部业务 · 客户视角</i>
        </span>
        <span class="go">登录 →</span>
      </button>
      <button class="id-item" data-role="customer" data-user="李静" data-level="普通客户">
        <span class="ico">👤</span>
        <span>
          <b>李静 · 普通客户</b>
          <i>余额较低 · 大额操作更早触发强验证 · 客户视角</i>
        </span>
        <span class="go">登录 →</span>
      </button>
      <button class="id-item" data-role="risk" data-user="风控坐席" data-level="管理员">
        <span class="ico">🛡️</span>
        <span>
          <b>风控管理员</b>
          <i>只看不办：任务 DAG、权限矩阵、审计日志 · 风控视角</i>
        </span>
        <span class="go">登录 →</span>
      </button>
    </div>

    <div class="login-note">
      <b>为什么没有密码输入框？</b>
      本作品是参赛演示，不做真实账户体系。身份选择只用于隔离"客户视角"与"风控视角"，
      以及演示红色高风险操作时的强验证流程；账户数据来自同一套虚构账本。
    </div>

    <div class="login-alt">
      想直接看强验证流程？登录后说一句「给王强转 1500 元」，确认后再过短信验证码即可。<br>没有账号？<a href="/register" style="color:#4b8ae6">注册一个（演示界面）</a>
    </div>
  </section>
</main>

<script>
  document.querySelectorAll(".id-item").forEach((btn) => {
    btn.onclick = () => {
      const d = btn.dataset;
      localStorage.setItem("yz_role", d.role === "risk" ? "risk" : "customer");
      localStorage.setItem("yz_view", d.role === "risk" ? "risk" : "customer");
      localStorage.setItem("yz_user", d.user);
      localStorage.setItem("yz_level", d.level);
      localStorage.setItem("yz_next", new URLSearchParams(location.search).get("next") || "/app");
      const next = new URLSearchParams(location.search).get("next") || localStorage.getItem("yz_next") || "/app";
      location.href = next;
    };
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "1" || e.key === "2" || e.key === "3") {
      const items = document.querySelectorAll(".id-item");
      const el = items[Number(e.key) - 1];
      if (el) el.click();
    }
  });
</script>
</body>
</html>
